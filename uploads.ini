; PHP overrides for WordPress uploads and admin operations.
; Mounted read-only at /usr/local/etc/php/conf.d/zz-uploads.ini
;
; Note: PHP's post_max_size must stay >= upload_max_filesize, otherwise
; uploads larger than post_max_size are dropped before PHP ever sees them.

upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 3000
